name: Calixa Therapeutics
description: 'Calixa Therapeutics was a privately held, San Diego-based biopharmaceutical
  company focused on developing antibiotics to treat serious infections caused by
  multi-drug-resistant Gram-negative bacterial pathogens. Its lead compound, CXA-201
  (later ceftolozane/tazobactam), was an intravenous therapy for serious hospital-acquired
  Gram-negative infections. Calixa was acquired by Cubist Pharmaceuticals in December
  2009 for approximately $92.5 million (plus up to $310 million in milestone payments)
  and no longer operates as an independent company. It has no public developer or API
  surface. This profile exists in the API Evangelist network as a portfolio-lead stub
  associated with canaan-partners; there are no API artifacts to enrich because it
  is a defunct pharmaceutical company, not an API provider.'
